name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Lint
        run: uvx ruff check
      - name: Versions agree (pyproject.toml, uv.lock, release-please manifest)
        # release-please bumps all three in its release PR; a hand edit to one
        # of them would make the published version differ from the tag.
        run: |
          python3 - <<'PY'
          import json, sys, tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          lock = [p["version"] for p in tomllib.load(open("uv.lock", "rb"))["package"] if p["name"] == project["name"]]
          released = json.load(open(".release-please-manifest.json")).get(".")
          print(f"pyproject={project['version']} uv.lock={lock} manifest={released}")
          ok = lock == [project["version"]] and released in (None, project["version"])
          sys.exit(0 if ok else "versions disagree: let release-please bump them, don't edit by hand")
          PY

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true  # keyed on uv.lock: skips re-downloading torch & co.
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          # The revision pinned in vectorstore/embedding.py: bump both together.
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2-onnx-1110a243
      - name: Install dependencies (from committed lockfile)
        run: uv sync --locked --all-extras
      - name: Start MinIO
        run: docker compose -f minio/docker-compose.yaml up -d
      - name: Wait for MinIO to be ready
        run: timeout 30 bash -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'
      - name: Run tests
        env:
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin123
        run: uv run pytest --cov

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build
        run: uvx hatchling build
      - name: Install the wheel in a clean venv and run it
        # Catches a wheel that leaves out packages the CLI imports.
        run: |
          uv venv /tmp/wheel-venv
          VIRTUAL_ENV=/tmp/wheel-venv uv pip install dist/*.whl
          /tmp/wheel-venv/bin/s3-vectors-cli --help
          /tmp/wheel-venv/bin/python -c "import api.main, vectorstore.core, vectorstore.embedding"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image and start MinIO + API
        run: docker compose up -d --build
      - name: Wait for the API to report healthy
        # The container's own health check (GET /status) is what `docker ps` and orchestrators see.
        run: timeout 180 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" "$(docker compose ps -q api)")" = healthy ]; do sleep 2; done'
      - name: Smoke test
        run: |
          set -euo pipefail
          curl -sf -X POST localhost:8000/upload/bulk -H 'content-type: application/json' \
            -d '{"docs": [{"doc_id": "cat", "text": "a cat sat on the mat", "metadata": {"kind": "pet"}},
                          {"doc_id": "rocket", "text": "rocket engine thrust", "metadata": {"kind": "space"}}]}'
          curl -sf -X POST localhost:8000/search -H 'content-type: application/json' \
            -d '{"query": "kitten on a rug", "top_k": 1}' | tee /dev/stderr | grep -q '"matches":\["cat"\]'
          curl -sf -X POST localhost:8000/search -H 'content-type: application/json' \
            -d '{"query": "kitten on a rug", "filter": {"kind": "space"}}' | grep -q '"matches":\["rocket"\]'
          test "$(docker compose exec -T api id -u)" = 10001
      - name: Logs
        if: failure()
        run: docker compose logs

  release-please:
    # On every push to main: opens (or updates) the release PR, which bumps
    # the version in pyproject.toml, uv.lock and the manifest and writes
    # CHANGELOG.md from the conventional-commit history. Merging that PR
    # makes this job tag the merge commit and create the GitHub release;
    # the publish jobs below then ship exactly that commit.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: release-please
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          # Optional: a PAT or app token, so CI also runs on the release PR
          # (PRs opened with the default GITHUB_TOKEN don't trigger workflows).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  publish:
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    needs: [release-please, build]
    # PyPI Trusted Publishing (OIDC): PyPI trusts this workflow + environment,
    # so there's no long-lived API token to store or leak. One-time setup on
    # pypi.org: a (pending) publisher for owner muratcanozdemir, repository
    # s3-vectors-at-home, workflow ci.yaml, environment pypi.
    environment:
      name: pypi
      url: https://pypi.org/project/s3-vectors-at-home/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Release tag must match the package version
        # Belt and braces: PyPI versions can't be reused.
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version=$(ls dist/*.whl | sed -E 's/.*-([^-]+)-py3-none-any\.whl/\1/')
          echo "tag=$TAG wheel=$version"
          test "${TAG#v}" = "$version"
      - uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  publish-image:
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    needs: [release-please, image, test, lint]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build and push to GitHub Container Registry
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$TAG" -t "$image:$TAG" -t "$image:latest" .
          docker push "$image:$TAG"
          docker push "$image:latest"
