[project]
name = "s3-vectors-at-home"
version = "0.1.0"
description = "S3 vector search with MinIO, FAISS, and FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "fastapi",
    "uvicorn",
    "minio",
    "faiss-cpu",
    "httpx",
    "torch>=2.4",
    "pydantic",
    "sentence-transformers>=3.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = ["pytest", "httpx", "pytest-cov"]

[project.scripts]
s3-vectors-cli = "s3_vectors_at_home.cli:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
