[project]
name = "s3-vectors-at-home"
version = "0.2.0"
description = "S3 vector search with MinIO, FAISS, and FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "fastapi",
    "uvicorn",
    "minio",
    "faiss-cpu",
    "httpx",
    "pydantic",
    # Embeddings: ONNX Runtime + tokenizers reproduce sentence-transformers'
    # all-MiniLM-L6-v2 without PyTorch (see vectorstore/embedding.py).
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "huggingface-hub>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
# boto3: tests drive the S3 Vectors API with the real AWS SDK.
dev = ["pytest", "httpx", "pytest-cov", "boto3>=1.40"]

[project.scripts]
s3-vectors-cli = "s3_vectors_at_home.cli:main"

[tool.hatch.build.targets.wheel]
# Without this hatchling only packages the directory matching the project
# name, so the wheel shipped the CLI without the code it imports.
packages = ["s3_vectors_at_home", "vectorstore", "api"]
